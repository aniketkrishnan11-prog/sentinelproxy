<!DOCTYPE html>
<html>
<head>
  <title>Login - SentinelProxy</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Login</h1>
  <form id="loginForm">
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Login</button>
  </form>
  <p id="message" class="error"></p>
  <p>No account? <a href="register.html">Register</a></p>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          // VULNERABLE: storing the JWT in localStorage.
          // Any JavaScript running on this page — including injected
          // attacker script via the stored XSS in notes.html — can read
          // this with a single line: localStorage.getItem('token')
          localStorage.setItem('token', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = 'notes.html';
        } else {
          document.getElementById('message').textContent = data.error;
        }
      } catch (err) {
        document.getElementById('message').textContent = 'Login failed';
      }
    });
  </script>
</body>
</html>
